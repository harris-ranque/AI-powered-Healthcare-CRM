<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract AI-powered healthcare background">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff" />
      <stop offset="55%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow3" cx="60%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ecg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#0f172a" stroke-opacity="0.05" stroke-width="1" />
    </pattern>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <rect width="1600" height="900" fill="url(#glow1)" />
  <rect width="1600" height="900" fill="url(#glow2)" />
  <rect width="1600" height="900" fill="url(#glow3)" />

  <!-- soft floating orbs -->
  <g opacity="0.55">
    <circle cx="220" cy="180" r="120" fill="#a5f3fc" opacity="0.45" />
    <circle cx="1380" cy="220" r="160" fill="#bbf7d0" opacity="0.35" />
    <circle cx="1200" cy="700" r="200" fill="#e0e7ff" opacity="0.45" />
    <circle cx="320" cy="720" r="140" fill="#bae6fd" opacity="0.4" />
  </g>

  <!-- neural-net style nodes and links (AI hint) -->
  <g stroke="#0ea5e9" stroke-opacity="0.35" stroke-width="1">
    <line x1="180" y1="260" x2="420" y2="180" />
    <line x1="180" y1="260" x2="380" y2="380" />
    <line x1="420" y1="180" x2="620" y2="260" />
    <line x1="380" y1="380" x2="620" y2="260" />
    <line x1="620" y1="260" x2="820" y2="180" />
    <line x1="620" y1="260" x2="820" y2="360" />
    <line x1="820" y1="180" x2="1020" y2="260" />
    <line x1="820" y1="360" x2="1020" y2="260" />
    <line x1="1020" y1="260" x2="1240" y2="200" />
    <line x1="1020" y1="260" x2="1220" y2="380" />

    <line x1="260" y1="640" x2="480" y2="600" />
    <line x1="480" y1="600" x2="680" y2="680" />
    <line x1="680" y1="680" x2="900" y2="600" />
    <line x1="900" y1="600" x2="1120" y2="680" />
    <line x1="1120" y1="680" x2="1340" y2="600" />
  </g>

  <g fill="#0ea5e9">
    <circle cx="180" cy="260" r="5" />
    <circle cx="420" cy="180" r="5" />
    <circle cx="380" cy="380" r="5" />
    <circle cx="620" cy="260" r="6" />
    <circle cx="820" cy="180" r="5" />
    <circle cx="820" cy="360" r="5" />
    <circle cx="1020" cy="260" r="6" />
    <circle cx="1240" cy="200" r="5" />
    <circle cx="1220" cy="380" r="5" />
  </g>
  <g fill="#10b981">
    <circle cx="260" cy="640" r="5" />
    <circle cx="480" cy="600" r="5" />
    <circle cx="680" cy="680" r="6" />
    <circle cx="900" cy="600" r="5" />
    <circle cx="1120" cy="680" r="5" />
    <circle cx="1340" cy="600" r="5" />
  </g>

  <!-- ECG heartbeat line (healthcare hint) -->
  <g filter="url(#soft)">
    <path
      d="M 0 540
         L 200 540
         L 240 540
         L 260 520
         L 280 560
         L 300 460
         L 320 620
         L 340 500
         L 360 540
         L 600 540
         L 640 540
         L 660 520
         L 680 560
         L 700 460
         L 720 620
         L 740 500
         L 760 540
         L 1000 540
         L 1040 540
         L 1060 520
         L 1080 560
         L 1100 460
         L 1120 620
         L 1140 500
         L 1160 540
         L 1600 540"
      fill="none" stroke="url(#ecg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- subtle medical cross watermark -->
  <g opacity="0.07" fill="#0f172a">
    <rect x="1380" y="120" width="40" height="160" rx="6" />
    <rect x="1320" y="180" width="160" height="40" rx="6" />
  </g>

  <!-- DNA-like double helix (faint) -->
  <g opacity="0.18" stroke="#10b981" stroke-width="2" fill="none">
    <path d="M 120 760 C 180 700, 240 820, 300 760 S 420 700, 480 760 S 600 820, 660 760" />
    <path d="M 120 760 C 180 820, 240 700, 300 760 S 420 820, 480 760 S 600 700, 660 760" />
  </g>
</svg>
